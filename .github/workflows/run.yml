name: Package and Deploy

on:
  push:
    branches:
      - master
    paths:
      - resource/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout master branch
      uses: actions/checkout@v2
      with:
        ref: master

    - name: Package files
      run: |
        mkdir -p output
        cp -r resource/* output/
        cd output
        zip -r package.zip .

    - name: Checkout resource branch
      uses: actions/checkout@v2
      with:
        ref: resource
        persist-credentials: false

    - name: Copy package to resource branch
      run: |
        cp output/package.zip .

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add package.zip
        git commit -m 'Add packaged files'
        git push origin resource
